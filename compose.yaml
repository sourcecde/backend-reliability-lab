services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reliability_lab
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reliability-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
      postgres_data: